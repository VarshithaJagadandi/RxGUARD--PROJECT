<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RxGuard — Rural Clinic Medication Safety Checker</title>
<meta name="description" content="Educational prototype: checks prescriptions for dangerous drug interactions, duplicate medicines, dose errors, allergies and pregnancy/age risks. English, Hindi, Telugu, Tamil. Works offline.">
<meta name="theme-color" content="#071231" id="metaTheme">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="css/style.css">
<script>/* set theme before paint to avoid a flash */
(function(){var t=null;try{t=localStorage.getItem('rxguard.theme')}catch(e){}
if(!t)t=(window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches)?'light':'dark';
document.documentElement.setAttribute('data-theme',t);})();</script>
</head>
<body>
<header class="topbar">
  <a class="brand" href="#"><img src="assets/logo.svg" alt="" width="54" height="54">
    <div><h1>RX<span>GUARD</span></h1><p data-t="tagline"></p></div></a>
  <div class="top-right">
    <div class="langs" role="group" aria-label="Language"><button data-lang="en" class="on">English</button><button data-lang="hi">हिन्दी</button><button data-lang="te">తెలుగు</button><button data-lang="ta">தமிழ்</button></div>
    <button class="themebtn" id="themeBtn" type="button" aria-label="Toggle theme">
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.6M12 18.9v2.6M2.5 12h2.6M18.9 12h2.6M5.3 5.3l1.9 1.9M16.8 16.8l1.9 1.9M5.3 18.7l1.9-1.9M16.8 7.2l1.9-1.9"/></svg>
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>
    </button>
    <div class="offline" id="offline"><i></i><span data-t="offline"></span></div>
  </div>
</header>

<div class="wrap">
<section class="hero" id="hero">
  <div>
    <span class="kicker" data-t="heroKicker"></span>
    <h2 data-t="heroTitle"></h2>
    <p class="sub" data-t="heroSub"></p>
    <div class="cta"><button class="btn" id="ctaSample" data-t="heroCta"></button><button class="btn ghost" id="ctaStart" data-t="heroCta2"></button></div>
  </div>
  <svg class="hero-art" viewBox="0 0 640 440" role="img" aria-label="Illustration: a rural clinic and a tablet showing a prescription safety score">
    <circle cx="330" cy="225" r="200" fill="var(--blob)"/><circle cx="330" cy="225" r="140" fill="var(--blob2)" opacity=".7"/>
    <ellipse cx="320" cy="402" rx="285" ry="20" fill="var(--ground)"/>
    <!-- tree -->
    <rect x="34" y="330" width="9" height="70" rx="3" fill="var(--trunk)"/><circle cx="38" cy="318" r="30" fill="var(--tree)"/><circle cx="58" cy="338" r="20" fill="var(--tree)" opacity=".85"/>
    <!-- clinic -->
    <rect x="78" y="215" width="210" height="185" rx="10" fill="var(--wall)"/>
    <path d="M62 222 L183 146 L304 222 Z" fill="var(--roof)"/>
    <circle cx="183" cy="190" r="24" fill="#fff"/><rect x="177" y="174" width="12" height="32" rx="2" fill="#e5365a"/><rect x="167" y="184" width="32" height="12" rx="2" fill="#e5365a"/>
    <rect x="158" y="318" width="50" height="82" rx="6" fill="var(--door)"/><circle cx="198" cy="362" r="3" fill="#fff"/>
    <rect x="100" y="250" width="42" height="42" rx="6" fill="var(--glass)"/><path d="M121 250v42M100 271h42" stroke="var(--wall)" stroke-width="3"/>
    <rect x="224" y="250" width="42" height="42" rx="6" fill="var(--glass)"/><path d="M245 250v42M224 271h42" stroke="var(--wall)" stroke-width="3"/>
    <!-- tablet -->
    <g transform="rotate(4 420 270)">
      <rect x="318" y="108" width="250" height="300" rx="26" fill="var(--device)"/>
      <rect x="330" y="124" width="226" height="268" rx="15" fill="var(--screen)"/>
      <rect x="346" y="140" width="90" height="10" rx="5" fill="var(--ink2)"/>
      <circle cx="443" cy="214" r="44" fill="none" stroke="var(--ring-bg)" stroke-width="11"/>
      <circle cx="443" cy="214" r="44" fill="none" stroke="var(--c-ring)" stroke-width="11" stroke-linecap="round" stroke-dasharray="254 277" transform="rotate(-90 443 214)"/>
      <text x="443" y="224" text-anchor="middle" font-size="30" font-weight="700" fill="var(--ink)">92</text>
      <rect x="346" y="278" width="194" height="36" rx="8" fill="var(--card)"/><rect x="346" y="278" width="6" height="36" rx="3" fill="#ff8a2a"/><rect x="362" y="288" width="110" height="7" rx="3.500" fill="var(--ink2)"/><rect x="362" y="301" width="70" height="6" rx="3" fill="var(--ink2)" opacity=".7"/>
      <rect x="346" y="322" width="194" height="36" rx="8" fill="var(--card)"/><rect x="346" y="322" width="6" height="36" rx="3" fill="#f5c518"/><rect x="362" y="332" width="90" height="7" rx="3.500" fill="var(--ink2)"/><rect x="362" y="345" width="120" height="6" rx="3" fill="var(--ink2)" opacity=".7"/>
    </g>
    <!-- shield -->
    <g transform="translate(520 52)"><path d="M40 0 L80 14 V50 C80 80 62 100 40 110 C18 100 0 80 0 50 V14 Z" fill="#2f6bff"/><path d="M40 8 L72 19 V50 C72 74 58 92 40 101 C22 92 8 74 8 50 V19 Z" fill="#4d8dff" opacity=".55"/><path d="M24 54 l12 12 l22 -26" stroke="#fff" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>
    <!-- capsules -->
    <g transform="translate(96 78) rotate(-32)"><rect width="92" height="38" rx="19" fill="#ff5370"/><path d="M46 0H73a19 19 0 0 1 0 38H46Z" fill="#fff"/><rect width="92" height="38" rx="19" fill="none" stroke="var(--ink2)" stroke-width="2"/></g>
    <g transform="translate(470 372) rotate(24)"><rect width="84" height="34" rx="17" fill="#2f6bff"/><path d="M42 0H67a17 17 0 0 1 0 34H42Z" fill="#fff"/><rect width="84" height="34" rx="17" fill="none" stroke="var(--ink2)" stroke-width="2"/></g>
    <circle cx="300" cy="86" r="13" fill="#ffd166"/><circle cx="300" cy="86" r="13" fill="none" stroke="var(--ink2)" stroke-width="2"/><path d="M290 86h20" stroke="var(--ink2)" stroke-width="2"/>
    <circle cx="590" cy="250" r="10" fill="#2fe37a" opacity=".9"/><circle cx="52" cy="190" r="8" fill="#5b9bff" opacity=".9"/>
    <!-- alert chip -->
    <g transform="translate(250 336)"><rect width="128" height="42" rx="21" fill="var(--screen)" stroke="var(--ink2)" stroke-width="2"/><circle cx="24" cy="21" r="12" fill="#ff8a2a"/><text x="24" y="26.500" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">!</text><rect x="46" y="14" width="68" height="7" rx="3.500" fill="var(--ink)"/><rect x="46" y="26" width="46" height="6" rx="3" fill="var(--ink2)"/></g>
  </svg>
</section>
<section class="feats" aria-label="Highlights">
  <div class="feat"><span class="ic"><svg viewBox="0 0 24 24"><path d="M7 18a4 4 0 0 1-.5-7.970A5.500 5.500 0 0 1 17 9a4.500 4.500 0 0 1 .5 9z"/><path d="M4 4l16 16"/></svg></span><div><b data-t="f1t"></b><span data-t="f1d"></span></div></div>
  <div class="feat"><span class="ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.800 3 2.800 15 0 18M12 3c-2.800 3-2.800 15 0 18"/></svg></span><div><b data-t="f2t"></b><span data-t="f2d"></span></div></div>
  <div class="feat"><span class="ic"><svg viewBox="0 0 24 24"><path d="M4 16a8 8 0 0 1 16 0"/><path d="M12 16l4-5"/><circle cx="12" cy="16" r="1.200"/></svg></span><div><b data-t="f3t"></b><span data-t="f3d"></span></div></div>
  <div class="feat"><span class="ic"><svg viewBox="0 0 24 24"><rect x="5" y="3.500" width="14" height="17" rx="2.500"/><path d="M8.500 9l1.500 1.500L12.500 8M8.500 15l1.500 1.500 2.500-2.500M14.500 10h2M14.500 16h2"/></svg></span><div><b data-t="f4t"></b><span data-t="f4d"></span></div></div>
</section>

<main class="layout">
  <aside class="col">
    <section class="panel" id="pPatient">
      <h2 class="t" data-t="patient"></h2>
      <div class="row2">
        <label class="f"><span data-t="age"></span><input id="age" type="number" min="0" max="120" inputmode="numeric" placeholder="35"></label>
        <label class="f"><span data-t="weight"></span><input id="weight" type="number" min="1" max="250" inputmode="decimal" placeholder="60"></label>
      </div>
      <div class="f"><span data-t="conditions"></span><div class="chips" id="condChips"></div></div>
      <div class="f"><span data-t="allergies"></span><div class="chips" id="allChips"></div></div>
      <label class="f"><span data-t="otherAllergy"></span><input id="otherAllergy" type="text" placeholder="e.g. cefixime"></label>
    </section>
  </aside>

  <section class="col center">
    <section class="panel" id="pRx">
      <h2 class="t" data-t="rx"></h2>
      <div class="addrow">
        <label class="f grow"><span data-t="addMed"></span><input id="medName" list="medlist" autocomplete="off" data-ph="medPH"></label>
        <label class="f w90"><span data-t="dose"></span><input id="medDose" type="number" min="0" step="any" inputmode="decimal" placeholder="500"></label>
        <label class="f w130"><span data-t="freq"></span><select id="medFreq"></select></label>
        <button class="btn" id="btnAdd" data-t="add"></button>
      </div>
      <datalist id="medlist"></datalist>
      <ul class="meds" id="meds"></ul>
      <details class="paste"><summary data-t="paste"></summary>
        <textarea id="pasteBox" rows="4" data-ph="pastePH"></textarea>
        <button class="btn ghost" id="btnParse" data-t="read"></button></details>
      <div class="samples"><span data-t="samples"></span><div class="chips" id="samples"></div>
        <button class="link" id="btnClear" data-t="clear"></button></div>
    </section>

    <section class="panel" id="pResult">
      <div class="res-head"><h2 class="t" data-t="check"></h2>
        <div class="acts"><button class="btn ghost sm" id="btnSpeak"></button><button class="btn ghost sm" id="btnPrint" data-t="print"></button><button class="btn ghost sm" id="btnCopy" data-t="copy"></button></div></div>
      <div id="results"></div>
    </section>
  </section>

  <aside class="col">
    <section class="panel score" id="pScore">
      <h2 class="t" data-t="score"></h2>
      <div class="ringwrap"><svg viewBox="0 0 120 120" class="ring"><circle cx="60" cy="60" r="50" class="bg"/><circle id="ringArc" cx="60" cy="60" r="50" class="fg" transform="rotate(-90 60 60)" stroke-dasharray="0 314"/></svg>
        <div class="ringtxt"><b id="scoreNum">–</b><small>/100</small></div></div>
      <div class="band" id="band"></div>
      <div class="counts" id="counts"></div>
    </section>
    <section class="panel">
      <h2 class="t" data-t="uncTitle"></h2>
      <div class="cov"><span data-t="coverage"></span><b id="cov">–</b></div>
      <div class="bar"><i id="covBar"></i></div>
      <p class="small" data-t="uncBody"></p>
    </section>
    <section class="panel notes">
      <h2 class="t" data-t="limits"></h2>
      <p class="small" data-t="limitsBody"></p>
    </section>
  </aside>
</main>
</div>

<div class="print-only" id="printHead"></div>
<script src="js/data.js"></script>
<script src="js/engine.js"></script>
<script src="js/i18n.js"></script>
<script src="js/i18n.more.js"></script>
<script src="js/app.js"></script>
</body>
</html>
